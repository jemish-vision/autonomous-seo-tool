<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEO Platform · Dashboard</title>
    <!-- Anti-flash theme: set data-theme before first paint (mirrors the old Next.js layout head script). -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var p = s === "light" || s === "dark" || s === "system" ? s : "system";
          var r = p === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : p;
          document.documentElement.setAttribute("data-theme", r);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-dvh overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
